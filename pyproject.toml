[project]
name = "fega-schmitt-client"
version = "0.1.0"
description = "Python-Client für die B2B-Schnittstellen von FEGA & Schmitt Elektrogroßhandel (SOAP-Preis-/Verfügbarkeitsservice)"
authors = [
    { name = "Daniel Glaser", email = "me@the78mole.de" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "click>=8.1.0",
]

[project.scripts]
fega = "fega_schmitt_client.cli:main"

[project.urls]
Homepage = "https://github.com/the78mole/fega-schmitt-client"
Repository = "https://github.com/the78mole/fega-schmitt-client"
Issues = "https://github.com/the78mole/fega-schmitt-client/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fega_schmitt_client"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=fega_schmitt_client --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "pre-commit>=4.0.0",
]
